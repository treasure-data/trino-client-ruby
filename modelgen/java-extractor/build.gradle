plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

def trinoVersion = providers
    .gradleProperty('trinoVersion')
    .getOrElse('483')

def javaVersion = providers
    .gradleProperty('javaVersion')
    .getOrElse('25')
    .toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

dependencies {
    implementation "io.trino:trino-client:${trinoVersion}"
    implementation "io.trino:trino-main:${trinoVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-parameter-names:${jacksonVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.trinoruby.modelgen.ModelExtractor'
}

test {
    useJUnitPlatform()
}

tasks.register('extractModels', JavaExec) {
    group = 'model generation'
    description = 'Extracts Trino models into an intermediate JSON schema'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass

    def version = trinoVersion

    def rootsFile = layout.projectDirectory.file(
            "config/roots-${version}.txt"
    )

    def outputFile = layout.projectDirectory.file(
            "../schemas/${version}.json"
    )

    args(
            '--trino-version', version,
            '--roots', rootsFile.asFile.absolutePath,
            '--output', outputFile.asFile.absolutePath
    )

    doFirst {
        println "Extractor Java: ${javaLauncher.get().executablePath}"
        println "Trino version: ${version}"
        println "Roots: ${rootsFile.asFile}"
        println "Output: ${outputFile.asFile}"
    }
}

tasks.register('printRuntimeClasspath') {
    group = 'help'

    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}